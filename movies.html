<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الأفلام | NOVA WATCH</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            background: #080b12;
            color: white;
        }

        header {
            height: 70px;
            background: #101521;
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 0 30px;
            border-bottom: 1px solid #202838;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #4da3ff;
            font-size: 25px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
        }

        nav a:hover {
            color: #4da3ff;
        }

        .container {
            padding: 40px 30px;
        }

        .title {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .description {
            color: #8994a6;
            margin-bottom: 30px;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter {
            background: #151c29;
            color: white;
            border: 1px solid #273246;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .filter:hover {
            background: #1677ff;
        }

        .movies {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(190px, 1fr));
            gap: 20px;
        }

        .movie {
            background: #111722;
            border: 1px solid #202838;
            border-radius: 12px;
            overflow: hidden;
            transition: .2s;
        }

        .movie:hover {
            transform: translateY(-5px);
            border-color: #1677ff;
        }

        .poster {
            height: 270px;
            background:
                linear-gradient(145deg, #19304c, #10151f);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
        }

        .info {
            padding: 15px;
        }

        .info h3 {
            margin-bottom: 8px;
        }

        .info p {
            color: #8994a6;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .watch {
            display: block;
            text-align: center;
            background: #1677ff;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 7px;
        }

        footer {
            margin-top: 50px;
            padding: 30px;
            text-align: center;
            color: #737f91;
            border-top: 1px solid #202838;
        }

        @media (max-width: 700px) {

            header {
                padding: 0 15px;
            }

            nav {
                display: none;
            }

            .container {
                padding: 30px 15px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        NOVA WATCH
    </div>

    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="movies.html">الأفلام</a>
        <a href="series.html">المسلسلات</a>
        <a href="live.html">مباشر</a>
    </nav>

</header>


<main class="container">

    <h1 class="title">
        🎬 الأفلام
    </h1>

    <p class="description">
        هنا ستظهر الأفلام التي سنجلب بياناتها من API حقيقي.
    </p>


    <div class="filters">

        <button class="filter" onclick="filterMovies('all')">
            الكل
        </button>

        <button class="filter" onclick="filterMovies('action')">
            أكشن
        </button>

        <button class="filter" onclick="filterMovies('comedy')">
            كوميديا
        </button>

        <button class="filter" onclick="filterMovies('drama')">
            دراما
        </button>

    </div>


    <section class="movies" id="movies">

        <article class="movie" data-category="action">

            <div class="poster">
                🎬
            </div>

            <div class="info">

                <h3>
                    فيلم تجريبي
                </h3>

                <p>
                    أكشن • 2026
                </p>

                <a
                    class="watch"
                    href="watch.html"
                >
                    مشاهدة
                </a>

            </div>

        </article>


        <article class="movie" data-category="comedy">

            <div class="poster">
                🍿
            </div>

            <div class="info">

                <h3>
                    فيلم كوميدي
                </h3>

                <p>
                    كوميديا • 2026
                </p>

                <a
                    class="watch"
                    href="watch.html"
                >
                    مشاهدة
                </a>

            </div>

        </article>


        <article class="movie" data-category="drama">

            <div class="poster">
                🎥
            </div>

            <div class="info">

                <h3>
                    فيلم درامي
                </h3>

                <p>
                    دراما • 2026
                </p>

                <a
                    class="watch"
                    href="watch.html"
                >
                    مشاهدة
                </a>

            </div>

        </article>

    </section>

</main>


<footer>

    <p>
        NOVA WATCH © 2026
    </p>

</footer>


<script>

function filterMovies(category) {

    const movies =
        document.querySelectorAll(".movie");

    movies.forEach(function(movie) {

        if (
            category === "all" ||
            movie.dataset.category === category
        ) {

            movie.style.display = "block";

        } else {

            movie.style.display = "none";

        }

    });

}

</script>

</body>
</html>
